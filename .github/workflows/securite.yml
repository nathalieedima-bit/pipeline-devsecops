name: Pipeline DevSecOps

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    name: Detection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Analyse statique du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: |
          pip install semgrep
          semgrep --config=p/security-audit --config=p/python --error app/

  dependances:
    name: Vulnerabilites des dependances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt

  image:
    name: Vulnerabilites de l image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l image
        run: docker build -t app-test:${{ github.sha }} ./app
      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app-test:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  synthese:
    name: Porte de securite
    runs-on: ubuntu-latest
    needs: [secrets, sast, dependances, image]
    if: always()
    steps:
      - name: Verdict
        run: |
          echo "Secrets      : ${{ needs.secrets.result }}"
          echo "SAST         : ${{ needs.sast.result }}"
          echo "Dependances  : ${{ needs.dependances.result }}"
          echo "Image        : ${{ needs.image.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "DEPLOIEMENT BLOQUE : au moins un controle de securite a echoue."
            exit 1
          fi
          echo "Tous les controles sont passes. Deploiement autorise."
